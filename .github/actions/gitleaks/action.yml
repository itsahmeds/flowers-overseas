# Installs the pinned gitleaks binary on the runner (spec 001 §8 "Logs / PII", AC-27 / T-28;
# TASK-011).
#
# Why a download and not `gitleaks/gitleaks-action@v2`: that action runs its own scan with its own
# arguments, which would mean two definitions of "what counts as a leak" — the one in
# `.gitleaks.toml` that a developer can reproduce with `pnpm audit`, and the action's. Installing
# the binary keeps `pnpm audit:secrets` the single implementation, locally and in CI.
#
# The tarball is pinned by version *and* SHA-256: this step downloads an executable from the
# internet and runs it over the whole working tree, so a moved tag must break the build rather
# than change what scans the repository. Bumping the version means bumping both, and the digest is
# printed by `shasum -a 256` on the release asset.
name: Install gitleaks
description: Install the pinned gitleaks release and put it on PATH

runs:
  using: composite
  steps:
    - name: Install gitleaks (pinned version and digest)
      shell: bash
      env:
        # Keep in step with `GITLEAKS_VERSION` in scripts/audit-secrets.ts (asserted by
        # tests/unit/audit-secrets.test.ts, which reads this file).
        GITLEAKS_VERSION: "8.28.0"
        GITLEAKS_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
      run: |
        set -euo pipefail
        tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
        dir="$RUNNER_TEMP/gitleaks"
        mkdir -p "$dir"
        curl -fsSL --retry 3 -o "$dir/$tarball" "$url"
        echo "$GITLEAKS_SHA256  $dir/$tarball" | sha256sum --check --strict
        tar -xzf "$dir/$tarball" -C "$dir" gitleaks
        chmod +x "$dir/gitleaks"
        echo "$dir" >> "$GITHUB_PATH"
        "$dir/gitleaks" version
