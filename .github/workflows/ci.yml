# CI (spec 001 §2 "CI"; TASK-002 + TASK-008 + TASK-009 + TASK-010 + TASK-011). AC-21: this file
# is the source of truth for the required-status-check set — `scripts/branch-protection.ts` reads
# the job names straight out of it, so a job added here is part of the branch-protection contract
# without anybody editing a list (`pnpm branch-protection --verify`).
#
# Jobs (18): lint · typecheck · test-unit · test-integration · test-contract · build · db-check ·
# env-build-failure · commitlint · seo-validate · i18n-check · dev-os-check · audit · preview · e2e ·
# visual · a11y · lighthouse.
#
# Order, and where it departs from spec 001 §2 / plan/12 §5 (TASK-011 reconciliation; the
# corrections are recorded on TASK-012 for the spec text):
#
#  - `lint` → `typecheck` is the spine. Everything that needs neither a browser nor a preview
#    deployment hangs off `typecheck` and runs in parallel: `test-unit`, `test-integration`,
#    `test-contract`, `env-build-failure`, `db-check`, `seo-validate`, `dev-os-check`, `audit`.
#    The spec lists them as a chain; running them as one would triple the wall-clock time of every
#    PR without catching anything a parallel fan-out misses, since none of them consumes another's
#    output. `build` keeps `needs: test-unit` (do not spend build minutes on a red unit suite).
#  - `i18n-check` joins that fan-out on `needs: typecheck` (spec 003 §2 "Lint, checks, CI", spec 001
#    §14 A9's placement rule): it reads committed JSON and greps `src/`, touches no preview
#    deployment, and its step summary is the translation-debt number the founder acts on (spec 003
#    §11), so it must be visible on every PR rather than behind the Playwright chain.
#  - **`env:check` has no job of its own.** It is a step of `lint` (added by TASK-005): it is a
#    key-set diff between `.env.example` and the zod schema that takes milliseconds and needs the
#    same checkout and install as the other lint steps. A separate job would add a runner, an
#    install and a required check for one `node` invocation. `pnpm env:check` therefore appears in
#    the `lint` job's step summary, and AC-11 is enforced on every PR.
#  - `db:check` runs as its own `db-check` job rather than a step of `build` (spec §2 puts it
#    after `build`): from spec 002 it grows a Postgres connection and drift detection, and a
#    separate job is where a service container can be attached without touching `build`.
#  - `seo-validate` and `dev-os-check` sit early, on `needs: typecheck`, not after `lighthouse`
#    where §2 lists them. Neither one touches a preview deployment (the SEO validators read
#    committed fixtures; the dev-OS checks run the hooks against temp projects), so making them
#    wait 15 minutes for a Vercel deployment would delay two of the fastest gates in the file for
#    no reason. Spec correction recorded on TASK-012.
#  - `audit` likewise sits early: `pnpm audit` and the secret scan are the cheapest way to find
#    out that a PR should not be looked at further.
#  - `preview` → `e2e`/`visual`/`a11y` → `lighthouse` is the one real chain and matches the spec:
#    the three Playwright suites and Lighthouse all run against the preview URL `preview` resolves.
#
# spec 001 §11: **every job writes a GitHub step summary.** A green tick says a command exited 0;
# the summary says what it measured, and it is what the reviewer quotes in the PR.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    # `shell: bash` is `bash --noprofile --norc -eo pipefail`, where the bare default is only
    # `bash -e`. Several steps below pipe a command into `tee` so its output can be summarised;
    # without `pipefail` those pipelines would report `tee`'s exit status and a failing gate would
    # show green.
    shell: bash

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # ESLint (incl. the five `fo/*` rules and the module boundaries) + Stylelint. `--max-warnings
      # 0` is not passed because every rule in `eslint.config.mjs` is configured as an error; the
      # count below is therefore the error count.
      - name: ESLint and Stylelint
        id: eslint
        run: pnpm lint 2>&1 | tee lint.log
      - name: No `eslint-disable` for fo/no-literal-strings under src/ (AC-6)
        run: pnpm check:no-literal-disable | tee no-literal-disable.log
      # The no-database seam of spec 003 (AC-2): the locale/currency/address config and the i18n
      # module must stay free of a database client, an ORM, a Postgres driver and `DATABASE_URL`,
      # which is what makes that spec implementable while spec 002's provisioning is parked.
      - name: No database import in the spec 003 file set (spec 003 AC-2)
        run: pnpm check:no-db | tee no-db.log
      - name: Prettier
        run: pnpm format:check | tee format.log
      # `.env.example` and the zod schema must agree in both directions (AC-11, TASK-005). It runs
      # here rather than in a job of its own: see the reconciliation note at the top of this file.
      - name: env:check — `.env.example` against the zod schema (AC-11)
        run: pnpm env:check | tee env-check.log
      - name: Summarise the lint gate
        if: always()
        run: |
          set -uo pipefail
          # `problems` counts ESLint/Stylelint problem lines; zero on a green run, which is the
          # only run that reaches this step with the earlier ones green.
          problems=0
          if [ -f lint.log ]; then
            problems=$(grep -cE '^\s+[0-9]+:[0-9]+\s+(error|warning)' lint.log || true)
          fi
          {
            echo "### lint"
            echo ""
            echo "| check | command | result |"
            echo "|---|---|---|"
            echo "| ESLint + Stylelint | \`pnpm lint\` | ${{ steps.eslint.outcome }}, $problems problem(s) |"
            echo "| eslint-disable audit (AC-6) | \`pnpm check:no-literal-disable\` | $( [ -f no-literal-disable.log ] && tr '\n' ' ' < no-literal-disable.log || echo 'did not run' ) |"
            echo "| no-db seam (spec 003 AC-2) | \`pnpm check:no-db\` | $( [ -f no-db.log ] && tr '\n' ' ' < no-db.log || echo 'did not run' ) |"
            echo "| Prettier | \`pnpm format:check\` | $( [ -f format.log ] && echo 'all matched' || echo 'did not run' ) |"
            echo "| env:check (AC-11) | \`pnpm env:check\` | $( [ -f env-check.log ] && tr '\n' ' ' < env-check.log || echo 'did not run' ) |"
          } >> "$GITHUB_STEP_SUMMARY"

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: tsc --noEmit
        id: tsc
        run: pnpm typecheck 2>&1 | tee tsc.log
      - name: Summarise the typecheck gate
        if: always()
        run: |
          set -uo pipefail
          errors=0
          if [ -f tsc.log ]; then
            errors=$(grep -cE 'error TS[0-9]+' tsc.log || true)
          fi
          # The strict flags themselves (AC-2) are asserted by `pnpm typecheck:fixtures` in the
          # unit suite (`tests/unit/*`, TASK-001), not here; this job's job is the project tree.
          {
            echo "### typecheck"
            echo ""
            echo "- \`pnpm typecheck\` (tsc --noEmit, strict): ${{ steps.tsc.outcome }}, $errors error(s)"
          } >> "$GITHUB_STEP_SUMMARY"

  # AC-16 / T-17 (TASK-008): the unit suite is the gate the other jobs stand on, so it runs before
  # `build`. Coverage is collected on every run (thresholds come from `vitest.coverage.json`,
  # empty in 001 and raised per module by specs 005/007 — plan/12 §4).
  test-unit:
    name: test-unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # `tests/unit/audit-secrets.test.ts` (T-28) skips its scans when gitleaks is absent, and the
      # summary step below fails the job on *any* skipped unit test. Installing the binary here is
      # what makes "skipped locally, enforced in CI" true rather than a comment.
      - uses: ./.github/actions/gitleaks
      - name: Run the unit suite with coverage
        run: >
          pnpm test:coverage
          --reporter=default
          --reporter=json
          --outputFile=vitest-unit.json
      - name: Summarise the run (T-17)
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f vitest-unit.json ]; then
            echo "::error::vitest produced no JSON report; cannot summarise the unit run"
            exit 1
          fi
          files=$(jq '.numTotalTestSuites' vitest-unit.json)
          total=$(jq '.numTotalTests' vitest-unit.json)
          passed=$(jq '.numPassedTests' vitest-unit.json)
          failed=$(jq '.numFailedTests' vitest-unit.json)
          skipped=$(jq '.numPendingTests + .numTodoTests' vitest-unit.json)
          {
            echo "### test-unit (AC-16 / T-17)"
            echo ""
            echo "- test files: $files"
            echo "- tests: $total (passed $passed, failed $failed, skipped $skipped)"
          } >> "$GITHUB_STEP_SUMMARY"
          # A skipped unit test is a test nobody runs: the unit layer has no allowance for one
          # (the *integration* suite is the only skipped suite in 001).
          if [ "$skipped" != "0" ]; then
            echo "::error::$skipped unit test(s) are skipped; the unit suite must have none (definition of done: no skipped tests)"
            exit 1
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage/
            vitest-unit.json
          retention-days: 7
          if-no-files-found: error

  # AC-16 / T-17 (TASK-008): the integration job — and its Postgres service container — exist from
  # 001 so spec 002 only has to delete a `.skip`. The suite is reported as skipped; the job still
  # proves the database the suite will use is up.
  test-integration:
    name: test-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowers_overseas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Consumed by `tests/integration/setup.ts`; it falls back to the `.env.example` placeholder
      # locally, so a clean clone needs no database.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/flowers_overseas_test
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Assert the Postgres service is healthy (T-17)
        run: |
          set -euo pipefail
          pg_isready -h localhost -p 5432 -U postgres
          server_version=$(PGPASSWORD=postgres psql -h localhost -U postgres -d flowers_overseas_test -tAc 'show server_version')
          {
            echo "### test-integration (AC-16 / T-17)"
            echo ""
            echo "- postgres service: healthy, server_version $server_version"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Run the integration suite (skipped until spec 002)
        run: >
          pnpm test:integration
          --reporter=default
          --reporter=json
          --outputFile=vitest-integration.json
      - name: Assert the suite is reported as skipped, not absent
        run: |
          set -euo pipefail
          files=$(jq '.numTotalTestSuites' vitest-integration.json)
          skipped=$(jq '.numPendingTests + .numTodoTests' vitest-integration.json)
          failed=$(jq '.numFailedTests' vitest-integration.json)
          {
            echo "- integration suite: $files file(s), $skipped skipped, $failed failed (spec 002 TODO)"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" != "0" ]; then
            echo "::error::the integration suite reported failures"
            exit 1
          fi
          if [ "$skipped" = "0" ]; then
            echo "::error::the integration suite reported no skipped test; AC-16 requires the spec-002 placeholder to be reported as skipped"
            exit 1
          fi

  # spec 001 §2 "CI" lists `test:contract` between `test-integration` and `build`. The layer is
  # empty in 001 — there is no adapter to pin and a fabricated fixture would pin a shape nobody
  # observed (`tests/contract/README.md` names the boundaries and their owning specs) — so the
  # project runs with `--passWithNoTests`. The job exists from the first PR for the same reason
  # `test-integration` does: spec 013/014/017 add a file, not a gate.
  test-contract:
    name: test-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run the contract suite
        run: >
          pnpm test:contract
          --reporter=default
          --reporter=json
          --outputFile=vitest-contract.json
      - name: Summarise the run
        if: always()
        run: |
          set -euo pipefail
          files=0
          total=0
          failed=0
          if [ -f vitest-contract.json ]; then
            files=$(jq '.numTotalTestSuites' vitest-contract.json)
            total=$(jq '.numTotalTests' vitest-contract.json)
            failed=$(jq '.numFailedTests' vitest-contract.json)
          fi
          {
            echo "### test-contract"
            echo ""
            echo "- test files: $files, tests: $total, failed: $failed"
            if [ "$total" = "0" ]; then
              echo "- the contract layer is empty in spec 001 by design; the first fixtures arrive"
              echo "  with specs 013 (Stripe), 014 (Mollie) and 017 (Resend) —"
              echo "  see \`tests/contract/README.md\`."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$failed" != "0" ]; then
            echo "::error::the contract suite reported failures"
            exit 1
          fi

  # spec 001 §5.1: a stub until spec 002. It already enforces the rule that would otherwise be
  # remembered too late — every migration has a checked-in rollback (`CLAUDE.md`) — and prints
  # `no migrations` while `supabase/migrations/` holds only its `.gitkeep`.
  db-check:
    name: db-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Check the migration set
        id: db
        run: pnpm db:check 2>&1 | tee db-check.log
      - name: Summarise the migration set
        if: always()
        run: |
          set -uo pipefail
          migrations=$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' ! -name '*.down.sql' | wc -l | tr -d ' ')
          rollbacks=$(find supabase/migrations -maxdepth 1 -type f -name '*.down.sql' | wc -l | tr -d ' ')
          {
            echo "### db-check (spec 001 §5.1)"
            echo ""
            echo "- \`pnpm db:check\`: ${{ steps.db.outcome }} — $( [ -f db-check.log ] && tr '\n' ' ' < db-check.log || echo 'did not run' )"
            echo "- forward migrations: $migrations; rollback files: $rollbacks"
            if [ "$migrations" = "0" ]; then
              echo "- stub until spec 002, which replaces the body of \`scripts/db-check.ts\` with"
              echo "  schema-drift and RLS checks against a real database."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # AC-27 / T-28 (TASK-011): the two halves of "is anything in here dangerous" — a vulnerable
  # production dependency and a committed credential. `pnpm run audit` runs both, so one command
  # reproduces this job locally. (`pnpm run`, not a bare `pnpm audit`: pnpm has a built-in `audit`
  # command that shadows the script of the same name. The two halves are separate steps here so
  # each gets its own status in the log and the step summary.)
  #
  # `--prod`: a devDependency advisory cannot reach a user, and failing every PR on one would
  # teach everybody to ignore this job. `--audit-level=high` is the gate spec 001 §8 asks for;
  # Renovate's `vulnerabilityAlerts` (see `renovate.json`) opens the fixing PR out of band.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan reads the working tree, so a shallow checkout is enough; `fetch-depth`
          # is left at its default deliberately rather than pulling the whole history for a scan
          # that would not act on it.
          fetch-depth: 1
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/gitleaks
      - name: pnpm audit (production dependencies, high and above)
        id: deps
        run: |
          set -uo pipefail
          pnpm audit --prod --audit-level=high --json > audit.json 2>audit.err || true
          pnpm audit --prod --audit-level=high 2>&1 | tee audit.log
          exit "${PIPESTATUS[0]}"
      - name: gitleaks (writes its own summary section)
        id: secrets
        run: pnpm audit:secrets
      - name: Summarise the dependency audit
        if: always()
        run: |
          set -uo pipefail
          # `pnpm audit --json` reports `{"advisories":{…},"metadata":{"vulnerabilities":{…}}}`.
          # `// empty` keeps the summary honest when the file is missing rather than printing 0.
          counts="unavailable"
          if [ -s audit.json ]; then
            counts=$(jq -r '[.metadata.vulnerabilities | to_entries[] | "\(.key): \(.value)"] | join(", ")' audit.json 2>/dev/null || echo "unavailable")
          fi
          {
            echo "### audit — dependencies (AC-27 / T-28)"
            echo ""
            echo "- \`pnpm audit --prod --audit-level=high\`: ${{ steps.deps.outcome }}"
            echo "- advisories by severity: $counts"
            echo "- gitleaks step: ${{ steps.secrets.outcome }} (its finding count is in the section below)"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test-unit
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # A clean clone builds from the committed placeholders (spec 001 §13 Q10, AC-1).
      - run: cp .env.example .env.local
      - name: next build
        id: next
        run: pnpm build 2>&1 | tee build.log
      # spec 003 AC-27 / T-27, restated by spec 004 §13 Q13 (TASK-046): the client-JS and
      # client-message-payload budgets, measured from the prerendered documents this build just
      # wrote. Three things the step now reports, in `budget.log`:
      #
      #  - per-URL script transfer as **Brotli**, against 122 880 bytes. That is the founder's
      #    2026-09-08 restatement of `plan/01` §7 (option (a)): the same number against the
      #    encoding Vercel serves and Lighthouse measures, instead of gzip, which made the same
      #    build "over" or "under" depending on the reader.
      #  - the serialised client message payload per locale, against 4 KB gzipped (unchanged).
      #  - **no zod and no browser Sentry SDK in any measured route's client bundle** (spec 004
      #    AC-25), asserted from the chunks the documents actually reference.
      #
      # `continue-on-error` is on the **step**, not the job, and one clause of it is still a
      # founder decision: with zod off the client, `/` measures 113.7 KB Brotli (within) and `/en`
      # 124.5 KB (3.7% over), because the Next 16.3.4 client runtime alone is ~112 KB Brotli and
      # `NextIntlClientProvider` costs 10.5 KB of the ~8 KB that leaves. Spec 004 §13 Q13 option
      # (b) is the recorded fallback and TASK-046 escalated it rather than loosening the number.
      # TASK-056 owns the flip to blocking; deleting the one line below is the whole flip.
      - name: Measure the client-JS budgets (AC-27 / T-27, AC-25)
        id: budget
        continue-on-error: true
        run: pnpm budget:client-js 2>&1 | tee budget.log
      - name: Summarise the client-JS budgets (AC-27 / T-27, AC-25)
        if: always()
        env:
          BUDGET_OUTCOME: ${{ steps.budget.outcome }}
        run: |
          set -uo pipefail
          {
            echo "### client-JS budgets (spec 003 AC-27 / T-27, spec 004 AC-25)"
            echo ""
            echo "\`pnpm budget:client-js\`: $BUDGET_OUTCOME (informational until TASK-056)."
            echo ""
            echo "Script transfer is measured as **Brotli** against 122 880 B — \`plan/01\` §7 as"
            echo "spec 004 §13 Q13 restated it (founder decision, option (a)). The gzip number is"
            echo "printed beside it because every older note in this repository quotes that one."
            echo "The run also asserts that no measured route ships \`zod\` or \`@sentry/\`."
            echo ""
            if [ -f budget.log ]; then
              sed -n '/^| URL /,/^$/p;/^| locale /,/^$/p' budget.log
              echo ""
              echo "<details><summary>chunks per URL</summary>"
              echo ""
              echo '```'
              sed -n '/^\//,$p' budget.log
              echo '```'
              echo ""
              echo "</details>"
            else
              echo "The step produced no output; read the step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f budget.log

      # AC-32 / T-33: `install && build` must leave the tree clean. The check belongs to whichever
      # job actually builds, and this is it.
      - name: Assert the working tree is clean after the build (AC-32 / T-33)
        run: |
          set -uo pipefail
          rm -f .env.local build.log
          porcelain=$(git status --porcelain)
          {
            echo "### build (AC-1, AC-32 / T-01, T-33)"
            echo ""
            echo "- \`pnpm build\` from \`.env.example\` placeholders: ${{ steps.next.outcome }}"
            if [ -z "$porcelain" ]; then
              echo "- \`git status --porcelain\` after install + build: empty"
            else
              echo "- \`git status --porcelain\` after install + build: **not empty**"
              echo ""
              echo '```'
              echo "$porcelain"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$porcelain" ]; then
            echo "::error::the working tree is dirty after install + build (AC-32); see the step summary"
            exit 1
          fi

  # T-11 / AC-10 (TASK-005): a missing variable must fail the build, name the offending key and
  # echo no other variable's value. A sentinel value is injected into a second key; the build
  # output must contain the key name and not the sentinel.
  env-build-failure:
    name: env-build-failure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: typecheck
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SENTINEL: SENTINEL_DO_NOT_PRINT_9f3a
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build with NEXT_PUBLIC_SUPABASE_URL removed and a sentinel in another key
        run: |
          set -o pipefail
          grep -v '^NEXT_PUBLIC_SUPABASE_URL=' .env.example > .env.local
          sed -i "s|^SUPABASE_SERVICE_ROLE_KEY=.*|SUPABASE_SERVICE_ROLE_KEY=$SENTINEL|" .env.local
          set +e
          pnpm build > build.log 2>&1
          status=$?
          set -e
          cat build.log
          if [ "$status" -eq 0 ]; then
            echo "::error::pnpm build exited 0 with NEXT_PUBLIC_SUPABASE_URL missing (AC-10)"
            exit 1
          fi
          if ! grep -q 'NEXT_PUBLIC_SUPABASE_URL' build.log; then
            echo "::error::build output does not name NEXT_PUBLIC_SUPABASE_URL (AC-10)"
            exit 1
          fi
          if grep -q "$SENTINEL" build.log; then
            echo "::error::build output echoed another variable's value (AC-10)"
            exit 1
          fi
          {
            echo "### env-build-failure (T-11 / AC-10)"
            echo ""
            echo "- \`pnpm build\` exit status: $status (non-zero, as required)"
            echo "- output names \`NEXT_PUBLIC_SUPABASE_URL\`: yes"
            echo "- output contains the sentinel value of another key: no"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the tampered env file
        if: always()
        run: rm -f .env.local build.log

  commitlint:
    name: commitlint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint every commit in the PR
        id: commitlint
        run: |
          set -uo pipefail
          pnpm exec commitlint \
            --from "${{ github.event.pull_request.base.sha }}" \
            --to "${{ github.event.pull_request.head.sha }}" \
            --verbose 2>&1 | tee commitlint.log
          exit "${PIPESTATUS[0]}"
      - name: Summarise the commit range (AC-20)
        if: always()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          commits=$(git rev-list --count "$BASE_SHA..$HEAD_SHA")
          problems=0
          if [ -f commitlint.log ]; then
            problems=$(grep -cE '^\s*✖' commitlint.log || true)
          fi
          {
            echo "### commitlint (AC-20 / T-21)"
            echo ""
            echo "- commits linted: $commits (\`$BASE_SHA..$HEAD_SHA\`)"
            echo "- config: \`@commitlint/config-conventional\`; result: ${{ steps.commitlint.outcome }}, $problems problem(s)"
          } >> "$GITHUB_STEP_SUMMARY"

  # AC-22 / T-23 (TASK-009): the three SEO validator CLIs over their committed fixture
  # directories. In spec 001 those directories hold only a `.gitkeep`, so the job prints
  # `no fixtures` three times and passes; spec 007 drops the real sitemap, hreflang and JSON-LD
  # fixtures in and this job turns red on a malformed one without a workflow change.
  #
  # `needs: typecheck` rather than `needs: lint`: the validators are TypeScript run under Node
  # type stripping, so a type error in them is a broken gate, and there is no reason to wait for
  # the unit suite.
  seo-validate:
    name: seo-validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Validate the SEO fixtures
        run: pnpm seo:validate | tee seo-validate.log
      - name: Summarise the fixture counts (AC-22)
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### seo-validate (AC-22 / T-23)"
            echo ""
            echo "| validator | fixture dir | fixtures |"
            echo "|---|---|---|"
            for kind in sitemap hreflang schema; do
              case "$kind" in
                sitemap) ext="xml" ;;
                *) ext="json" ;;
              esac
              count=$(find "tests/fixtures/seo/$kind" -maxdepth 1 -type f -name "*.$ext" | wc -l | tr -d ' ')
              echo "| validate-$kind | \`tests/fixtures/seo/$kind\` | $count |"
            done
            echo ""
            echo "Bad-fixture cases live in \`tests/fixtures/seo/_cases/\` and are exercised by the unit"
            echo "suite in a temp directory, so this job's directories stay in their committed state."
          } >> "$GITHUB_STEP_SUMMARY"

  # spec 003 §2 "Lint, checks, CI", §11, AC-13, AC-22 / T-13, T-22 (TASK-040): the catalogue gate.
  # `pnpm i18n:check` fails on a key missing after fallback resolution, an unused `en` key without
  # `retained: true`, an ICU syntax error, an argument-set mismatch between a key and a
  # translation, a redundant `en-gb` override, a missing or orphan review record, a stale
  # `sourceHash`, or a `pathSegments` value that is not a unique lowercase-ASCII URL segment.
  #
  # `--summary` is what makes this job the observability surface of spec 003 §11: the script
  # appends the per-locale table (keys, missing after fallback, unreviewed count and share, stale
  # count, indexable) to `$GITHUB_STEP_SUMMARY` itself, computed from `unreviewedShare()` and
  # `isLocaleIndexable()` — the same functions spec 007 gates hreflang and sitemap membership
  # with, so a locale cannot look ready here and be excluded in code. While `de` and `pl` are
  # machine-drafted echoes of English they read 100 % unreviewed and `no`, which is the correct
  # answer, not a failure.
  i18n-check:
    name: i18n-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: i18n:check — catalogues, manifests and pathSegments (AC-13, AC-22)
        id: i18n
        run: pnpm i18n:check --summary 2>&1 | tee i18n-check.log
      - name: Summarise the verdict
        if: always()
        run: |
          set -uo pipefail
          {
            echo ""
            echo "#### verdict"
            echo ""
            echo "| check | command | result |"
            echo "|---|---|---|"
            echo "| catalogue gate (AC-13, AC-22) | \`pnpm i18n:check --summary\` | ${{ steps.i18n.outcome }} |"
            echo ""
            if [ -f i18n-check.log ] && grep -q 'i18n:check failed' i18n-check.log; then
              echo "<details><summary>problems</summary>"
              echo ""
              echo '```'
              grep -A 200 'i18n:check failed' i18n-check.log
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # AC-24, AC-25, AC-26 / T-25, T-26, T-27 (TASK-010): the dev-OS gate. Runs the shell checks in
  # `tests/dev-os/` against the real `.claude/hooks/task-guard.sh`, `.claude/hooks/tasks-reminder.sh`
  # and `.claude/bin/task.sh`, so a change to a hook that breaks the "no code without a task"
  # rule turns a PR red instead of being noticed the next time an agent writes to `src/`.
  # spec 001 §11: this job's output is the audit trail that the guard and `task.sh` behave as
  # documented, so `scripts/dev-os-check.ts` writes the per-check assertion counts to the step
  # summary itself.
  #
  # Runner requirements: `bash`, `git` and `python3` (the guard parses its PreToolUse payload with
  # it) — all three are preinstalled on `ubuntu-latest`. The checks never touch the checkout's
  # `.claude/state/` or `TASKS.md`: each one points `CLAUDE_PROJECT_DIR` at a temp project.
  #
  # `needs: typecheck` rather than `needs: test-unit`: `pnpm test` already runs the same checks
  # through `tests/unit/dev-os.test.ts`, and this job exists to report them separately and
  # readably, so it should not queue behind the whole unit suite.
  dev-os-check:
    name: dev-os-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Assert the runner has what the hooks need
        run: |
          set -euo pipefail
          bash --version | head -n1
          git --version
          python3 --version
      - name: Run the dev-OS checks
        run: pnpm dev-os:check

  # AC-29 / T-30 (TASK-007): every pull request gets a Vercel preview deployment. This job proves,
  # on each PR, the three properties the spec asks for: Deployment Protection is enabled
  # (unauthenticated request is refused), the functions run in `fra1` (spec 001 §5 Hosting, §8
  # data residency) and every response carries `X-Robots-Tag: noindex` (§5, AC-15).
  #
  # The account-side half of TASK-007 is a founder action: until the Vercel project is linked and
  # `VERCEL_AUTOMATION_BYPASS_SECRET` is set, this job fails by design — see
  # `docs/runbooks/vercel-setup.md`. It never skips silently: an unprotected or unlinked preview
  # must be visible on the PR.
  preview:
    name: preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      deployments: read
    outputs:
      preview_url: ${{ steps.wait.outputs.preview_url }}
    steps:
      - name: Require the protection-bypass secret
        env:
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ -z "$BYPASS_SECRET" ]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is not set in this repository. Create a Protection Bypass for Automation in the Vercel project and run 'gh secret set VERCEL_AUTOMATION_BYPASS_SECRET' (docs/runbooks/vercel-setup.md)."
            exit 1
          fi

      - name: Wait for the Vercel preview deployment
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # 45 attempts x 20 s = 15 minutes (spec 001 §5: preview must exist before e2e runs).
          ATTEMPTS: "45"
          INTERVAL: "20"
        run: |
          set -euo pipefail
          preview_url=""
          for attempt in $(seq 1 "$ATTEMPTS"); do
            # `select(... != "production")`: a push to `main` and a PR can share a head SHA, and
            # the Production deployment must never be handed to the e2e/visual/a11y jobs — they
            # run destructive-by-default browser traffic and assert preview-only headers.
            deployments=$(gh api "repos/$REPO/deployments?sha=$HEAD_SHA&per_page=100" \
              --jq '.[] | select(((.environment // "") | ascii_downcase) != "production") | .id' || true)
            for id in $deployments; do
              url=$(gh api "repos/$REPO/deployments/$id/statuses?per_page=100" \
                --jq 'map(select(.state == "success" and (.environment_url // "") != "" and (((.environment // "") | ascii_downcase) != "production"))) | .[0].environment_url // ""' || true)
              if [ -n "$url" ]; then
                preview_url="$url"
                break
              fi
            done
            if [ -n "$preview_url" ]; then break; fi
            echo "no successful deployment with an environment_url yet for $HEAD_SHA (attempt $attempt/$ATTEMPTS)"
            sleep "$INTERVAL"
          done
          if [ -z "$preview_url" ]; then
            echo "::error::no successful Vercel deployment with an environment_url appeared for $HEAD_SHA within 15 minutes. Is the Vercel Git integration connected (docs/runbooks/vercel-setup.md)?"
            exit 1
          fi
          preview_url="${preview_url%/}"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          {
            echo "### preview (AC-29)"
            echo ""
            echo "- preview URL: $preview_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify protection, region and noindex on the preview (T-30)
        env:
          PREVIEW_URL: ${{ steps.wait.outputs.preview_url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          # 1. Without the bypass: Deployment Protection must refuse the request. Vercel
          # Authentication does not answer 401/403 to a plain GET: it answers a 302 to
          # `https://vercel.com/sso-api?url=...` (plus a `_vercel_sso_nonce` cookie). Both shapes
          # count as protected; a 200, or a redirect anywhere else, does not.
          unauth_headers=$(mktemp)
          unprotected_status=$(curl -sSI -o "$unauth_headers" -w '%{http_code}' "$PREVIEW_URL/api/health")
          unprotected_location=$(grep -i '^location:' "$unauth_headers" | head -n1 | cut -d' ' -f2- | tr -d '\r' || true)
          rm -f "$unauth_headers"
          case "$unprotected_status" in
            401|403)
              protection_evidence="$unprotected_status"
              ;;
            301|302|303|307|308)
              case "$unprotected_location" in
                https://vercel.com/sso-api|https://vercel.com/sso-api[?/]*)
                  protection_evidence="$unprotected_status to vercel.com/sso-api"
                  ;;
                *)
                  echo "::error::GET $PREVIEW_URL/api/health without the bypass header returned $unprotected_status redirecting to '$unprotected_location'; expected 401, 403, or a redirect to https://vercel.com/sso-api. Deployment Protection is not enabled on previews (AC-29)."
                  exit 1
                  ;;
              esac
              ;;
            *)
              echo "::error::GET $PREVIEW_URL/api/health without the bypass header returned $unprotected_status; expected 401, 403, or a 302 to https://vercel.com/sso-api. Deployment Protection is not enabled on previews (AC-29)."
              exit 1
              ;;
          esac

          # 2. With the bypass: 200, function region fra1, and noindex.
          headers=$(mktemp)
          bypass_status=$(curl -sSI -o "$headers" -w '%{http_code}' \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            -H "x-vercel-set-bypass-cookie: false" \
            "$PREVIEW_URL/api/health")
          if [ "$bypass_status" != "200" ]; then
            echo "::error::GET $PREVIEW_URL/api/health with the bypass header returned $bypass_status; expected 200 (AC-29)."
            exit 1
          fi
          vercel_id=$(grep -i '^x-vercel-id:' "$headers" | head -n1 | cut -d' ' -f2- | tr -d '\r')
          if [ -z "$vercel_id" ]; then
            echo "::error::no x-vercel-id response header; cannot verify the function region (AC-29)."
            exit 1
          fi
          # `x-vercel-id` is `<cdn-node>::<function-region>::<id>`: the first segment is the edge
          # node that took the request (wherever the runner is), so `fra1` must be *a* segment,
          # never the prefix.
          case "::$vercel_id::" in
            *"::fra1::"*) ;;
            *)
              echo "::error::x-vercel-id is '$vercel_id'; expected 'fra1' as one of its '::'-separated segments (spec 001 §5 Hosting, §8 EU data residency)."
              exit 1
              ;;
          esac
          robots=$(grep -i '^x-robots-tag:' "$headers" | head -n1 | cut -d' ' -f2- | tr -d '\r')
          case "$robots" in
            *noindex*) ;;
            *)
              echo "::error::X-Robots-Tag is '$robots'; every Phase 0 response must be noindex (spec 001 §5, AC-15)."
              exit 1
              ;;
          esac
          # `tee` so the T-30 evidence is in the job *log* as well: a step summary cannot be read
          # back through the API, and the reviewer has to quote these four values in the PR.
          {
            echo "- unauthenticated \`/api/health\`: $protection_evidence (protected)"
            echo "- with bypass: $bypass_status"
            echo "- \`x-vercel-id\`: $vercel_id (fra1 present)"
            echo "- \`X-Robots-Tag\`: $robots"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          rm -f "$headers"

  # AC-17 / T-15, T-16, T-18 (TASK-008): the Playwright suites run against the *preview*
  # deployment, not a local server — that is what the AC asks for and the only place the Vercel
  # headers (`fra1`, `X-Robots-Tag`, Deployment Protection) are real. `PLAYWRIGHT_BASE_URL` is the
  # URL the `preview` job resolved; `VERCEL_AUTOMATION_BYPASS_SECRET` gets the request past
  # Deployment Protection (`playwright.config.ts` sends it, and never logs it).
  #
  # These jobs are skipped on `push` to `main`, because `preview` is a pull-request job.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preview
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.preview.outputs.preview_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - name: pnpm test:e2e
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-e2e.json
        run: pnpm test:e2e --reporter=github,json,list
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Summarise the e2e run (AC-14, AC-15 / T-15, T-16)
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f playwright-e2e.json ]; then
            echo "::error::Playwright produced no JSON report; cannot summarise the e2e run"
            exit 1
          fi
          # `suites` is a tree; `..|.tests?//empty` flattens it to every test, whatever the nesting.
          expected=$(jq '[.suites | .. | .tests? // empty | .[]] | length' playwright-e2e.json)
          statuses=$(jq -r '[.suites | .. | .specs? // empty | .[] | if .ok then "passed" else "failed" end] | group_by(.) | map("\(.[0]): \(length)") | join(", ")' playwright-e2e.json)
          # The projects that actually ran, not every project in `playwright.config.ts`.
          projects=$(jq -r '[.suites | .. | .specs? // empty | .[] | .tests[].projectName] | unique | join(", ")' playwright-e2e.json)
          {
            echo "### e2e (AC-14, AC-15 / T-15, T-16)"
            echo ""
            echo "- target: ${{ needs.preview.outputs.preview_url }}"
            echo "- projects: $projects"
            echo "- tests: $expected — $statuses"
          } >> "$GITHUB_STEP_SUMMARY"

  visual:
    name: visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preview
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.preview.outputs.preview_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      # Baselines are committed (AC-17) and, since spec 003 gave `/` real text, per platform:
      # this job compares against `__screenshots__/<project>/linux/`. `--update-snapshots` is
      # never passed here, so a missing or changed baseline fails the job — and the artifact
      # below carries the screenshots Playwright wrote, which is how the `linux/` baseline is
      # produced without a Linux machine (see `playwright.config.ts`).
      - name: pnpm test:visual
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-visual.json
        run: pnpm test:visual --reporter=github,json,list
      - name: Upload the Playwright report (with the diff images)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-visual
          path: |
            playwright-report/
            test-results/
            tests/visual/__screenshots__/
          retention-days: 7
          if-no-files-found: warn
      - name: Summarise the visual run (AC-17 / T-18)
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f playwright-visual.json ]; then
            echo "::error::Playwright produced no JSON report; cannot summarise the visual run"
            exit 1
          fi
          # `suites` is a tree; `..|.tests?//empty` flattens it to every test, whatever the nesting.
          expected=$(jq '[.suites | .. | .tests? // empty | .[]] | length' playwright-visual.json)
          statuses=$(jq -r '[.suites | .. | .specs? // empty | .[] | if .ok then "passed" else "failed" end] | group_by(.) | map("\(.[0]): \(length)") | join(", ")' playwright-visual.json)
          # The projects that actually ran, not every project in `playwright.config.ts`.
          projects=$(jq -r '[.suites | .. | .specs? // empty | .[] | .tests[].projectName] | unique | join(", ")' playwright-visual.json)
          {
            echo "### visual (AC-17 / T-18)"
            echo ""
            echo "- target: ${{ needs.preview.outputs.preview_url }}"
            echo "- projects: $projects"
            echo "- tests: $expected — $statuses"
            echo "- screenshots compared against the committed baselines at a 0.1 % threshold;"
            echo "  a missing baseline fails the job (\`--update-snapshots\` is never passed in CI)."
          } >> "$GITHUB_STEP_SUMMARY"

  a11y:
    name: a11y
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: preview
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.preview.outputs.preview_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      # spec 001 §8: zero serious/critical axe violations on `/`.
      - name: pnpm test:a11y
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-a11y.json
        run: pnpm test:a11y --reporter=github,json,list
      - name: Upload the Playwright report (with the axe attachment)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-a11y
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Summarise the a11y run (AC-17 / T-18)
        if: always()
        run: |
          set -uo pipefail
          if [ ! -f playwright-a11y.json ]; then
            echo "::error::Playwright produced no JSON report; cannot summarise the a11y run"
            exit 1
          fi
          # `suites` is a tree; `..|.tests?//empty` flattens it to every test, whatever the nesting.
          expected=$(jq '[.suites | .. | .tests? // empty | .[]] | length' playwright-a11y.json)
          statuses=$(jq -r '[.suites | .. | .specs? // empty | .[] | if .ok then "passed" else "failed" end] | group_by(.) | map("\(.[0]): \(length)") | join(", ")' playwright-a11y.json)
          # The projects that actually ran, not every project in `playwright.config.ts`.
          projects=$(jq -r '[.suites | .. | .specs? // empty | .[] | .tests[].projectName] | unique | join(", ")' playwright-a11y.json)
          {
            echo "### a11y (AC-17 / T-18)"
            echo ""
            echo "- target: ${{ needs.preview.outputs.preview_url }}"
            echo "- projects: $projects"
            echo "- tests: $expected — $statuses"
            echo "- axe: zero serious/critical violations required (spec 001 §8)."
          } >> "$GITHUB_STEP_SUMMARY"

  # AC-23 / T-24 (TASK-009); spec 003 AC-27 / T-27 (TASK-043): Lighthouse CI against the preview
  # with the `plan/01` §7 budgets as assertions, over the URL set in
  # `tests/fixtures/seo/lighthouse-urls.json` — `/`, `/en` and `/de` since TASK-043.
  #
  # spec 001 §13 Q4 made it informational "until spec 004". TASK-043 measured what that flip
  # actually depends on, and it is not a schedule: on **Next 16.3.4 the framework's own client
  # runtime is 130.1 KB gzipped** (react-dom 71.4 + the App Router runtime 46.0 + ~12.7 KB of
  # bootstrap), against a 120 KB script budget, on a document with no application JavaScript at
  # all. Removing the browser Sentry SDK took `/` from 297 KB to 221 KB gz and `/en` from 309 KB
  # to 233 KB; what remains above the floor is the zod that Next's root error boundary drags in
  # (85 KB gz — see spec 003 §14 A12). Whether the budget moves or the framework does is a founder
  # decision, recorded as **spec 003 §14 A12** and carried on TASK-043's Blockers cell; a
  # permanently red required check would decide it by attrition instead. So the job keeps
  # `continue-on-error: true` and the assertions stay `error` in `lighthouserc.json`: the numbers
  # are measured and published on every PR, they simply do not block. Spec 004 task 2 owns the
  # flip together with `scripts/check-bundle-budget.ts` (spec 004 §2), and spec 007 adds the
  # nightly run.
  #
  # `NO_FCP` — Lighthouse aborting because the page painted nothing — was the expected outcome for
  # the whole of spec 001 and is no longer expected at all since TASK-035 gave `/` real text. The
  # branch below stays because that outcome must never be read as a verdict in either direction,
  # and the step summary is written *after* the run so it can say which of the three happened
  # instead of guessing in advance.
  #
  # `@lhci/cli` is fetched pinned by `npx` instead of being a devDependency: it pulls in Lighthouse
  # and Chrome plumbing that every other job would then install on every run, and it is needed in
  # exactly this one place.
  lighthouse:
    name: lighthouse
    runs-on: ubuntu-latest
    # Three URLs x three runs on a shared runner; 20 minutes was sized for one URL.
    timeout-minutes: 30
    needs: preview
    continue-on-error: true
    env:
      PLAYWRIGHT_BASE_URL: ${{ needs.preview.outputs.preview_url }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run Lighthouse CI against the preview
        id: lhci
        run: |
          set -euo pipefail
          # The bypass secret travels as a request header, never in a URL or a log line; GitHub
          # masks it in the output, and `extraHeaders` is built here rather than committed.
          headers=$(BYPASS="$VERCEL_AUTOMATION_BYPASS_SECRET" node -e \
            'process.stdout.write(JSON.stringify({ "x-vercel-protection-bypass": process.env.BYPASS, "x-vercel-set-bypass-cookie": "false" }))')
          # Assigned first so `set -e` aborts when the URL list is unreadable, instead of running
          # Lighthouse against nothing. Left unquoted below on purpose: one word per URL.
          urls=$(node scripts/seo/lighthouse-urls.ts)
          # shellcheck disable=SC2086
          npx --yes @lhci/cli@0.15.1 autorun \
            --config=lighthouserc.json \
            --collect.settings.extraHeaders="$headers" \
            $urls 2>&1 | tee lhci-output.log

      # Written after the run, with `if: always()`, because "did the budgets hold?" is not
      # answerable before it. The `NO_FCP` branch is the expected one for the whole of spec 001 and
      # it says so in as many words: no measurement happened, so no verdict is available.
      - name: Summarise what Lighthouse actually measured
        if: always()
        env:
          LHCI_OUTCOME: ${{ steps.lhci.outcome }}
          PREVIEW_URL: ${{ needs.preview.outputs.preview_url }}
        run: |
          set -uo pipefail
          log=lhci-output.log
          {
            echo "### lighthouse (AC-23 / T-24)"
            echo ""
            echo "URL set \`tests/fixtures/seo/lighthouse-urls.json\` against $PREVIEW_URL."
            echo "**Informational, and why:** Next 16.3.4's own client runtime measures 130.1 KB"
            echo "gzipped against a 120 KB script budget on a document with no application"
            echo "JavaScript, so this job carries \`continue-on-error: true\` until the founder"
            echo "rules on the budget (spec 003 §14 A12). A red check here never blocks the PR."
            echo "\`pnpm budget:client-js\` in the \`build\` job measures the same bytes from the"
            echo "build output, per chunk, and is the number to read when this one moves."
            echo ""
            if [ "$LHCI_OUTCOME" = "success" ]; then
              echo "**Budgets measured and met.** Every assertion in \`lighthouserc.json\` is an"
              echo "\`error\` and none fired, so the \`plan/01\` §7 budgets hold on this preview."
              echo ""
              if [ -f .lighthouseci/manifest.json ]; then
                echo "| URL | performance | accessibility | best-practices | seo |"
                echo "|---|---|---|---|---|"
                jq -r '.[] | select(.isRepresentativeRun) | "| \(.url) | \(.summary.performance) | \(.summary.accessibility) | \(.summary["best-practices"]) | \(.summary.seo) |"' \
                  .lighthouseci/manifest.json
              fi
            elif [ -f "$log" ] && grep -qE 'NO_FCP|did not paint any content' "$log"; then
              echo "**No budget was measured: this is neither a budget breach nor a pass.**"
              echo ""
              echo "Lighthouse aborted with \`NO_FCP\` (\"the page did not paint any content\") before"
              echo "a single metric existed, so the \`plan/01\` §7 assertions in \`lighthouserc.json\`"
              echo "were never evaluated and no conclusion about the budgets can be drawn from this"
              echo "run in either direction. Unlike in spec 001, this is **not** the expected"
              echo "outcome any more: every measured URL renders text since TASK-035, so a"
              echo "\`NO_FCP\` here means the preview did not serve the document — read the step log."
            else
              echo "**The run failed before reaching a verdict on the budgets.**"
              echo ""
              echo "Lighthouse exited non-zero for a reason other than \`NO_FCP\` — an unreachable"
              echo "preview, a rejected bypass header, or an \`@lhci/cli\` error. Read the step log:"
              echo "only a failure that lists a metric against its budget is a budget breach;"
              echo "anything else measured nothing."
            fi
            # `tee`, not `>>`: the same verdict belongs in the step log, so it can be read from
            # `gh run view --log` without opening the run summary page.
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouseci
          path: .lighthouseci/
          retention-days: 7
          # Empty is the normal spec 001 outcome: `NO_FCP` aborts before a report is written, and
          # the step summary above already explains why. Not a warning.
          if-no-files-found: ignore
