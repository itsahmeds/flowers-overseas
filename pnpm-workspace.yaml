allowBuilds:
  # Source maps are never uploaded from a build (spec 001 §5: Sentry is inert without a DSN and
  # `pnpm build` needs no network), so the `sentry-cli` binary is not downloaded/built.
  "@sentry/cli": false
  # `msw` only builds to copy the browser service worker into `public/`; the harness uses the
  # node `setupServer` (spec 001 §2 "Testing harness"), so the script is not needed.
  msw: false
  sharp: false
  unrs-resolver: false
